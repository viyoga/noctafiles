[notification]
show_app_name = false

[notification.filter.default-timeout]
match_content = ".*"
override_duration = 2000

[osd]
position = "top_center"
scale = 1.0

[shell.launcher.dmenu.entry.s]
label = "Web Search"
prefix = "s"
glyph = "world"
global = false
freeform = true
command = """
  printf "plain <query>  —  Google (default)\\ngg <query>  —  Google\\ndd <query>  —  DuckDuckGo\\nbr <query>  —  Brave\\nss <query>  —  Startpage\\n<domain>.com  —  direct\\n"
"""
exec = """
  sel="{query}"
  case "$sel" in
    *.com)              xdg-open "https://${sel%/}" ;;
    "gg "*|"plain "*)   xdg-open "https://www.google.com/search?q=$(printf '%s' "${sel#* }" | jq -sRr @uri)" ;;
    "dd "*)             xdg-open "https://duckduckgo.com/?q=$(printf '%s' "${sel#dd }" | jq -sRr @uri)" ;;
    "br "*)             xdg-open "https://search.brave.com/search?q=$(printf '%s' "${sel#br }" | jq -sRr @uri)" ;;
    "ss "*)             xdg-open "https://www.startpage.com/sp/search?query=$(printf '%s' "${sel#ss }" | jq -sRr @uri)" ;;
    *)                  xdg-open "https://www.google.com/search?q=$(printf '%s' "$sel" | jq -sRr @uri)" ;;
  esac
"""

[shell.launcher.dmenu.entry.hypr]
label = "Hyprland Layout"
prefix = "hypr"
glyph = "layout"
global = false
freeform = false
command = """
  printf "Dwindle\\nScrolling"
"""
exec = """
  case "{selection}" in
    Dwindle) hyprctl eval "hl.config({general={layout='dwindle'}})" && notify-send "Hyprland" "Layout: Dwindle" ;;
    Scrolling) hyprctl eval "hl.config({general={layout='scrolling'}})" && notify-send "Hyprland" "Layout: Scrolling" ;;
  esac
"""

[shell.launcher.dmenu.entry.note]
label = "Notes"
prefix = "note"
glyph = "file-text"
global = false
freeform = true
command = """
  awk '{print NR "\t" $0}' /home/kabir/Documents/Obsidian-vaults/kittybox/todo.md
"""
exec = """
  line=$(echo "{selection}" | awk -F'\t' '{if ($1 ~ /^[0-9]+$/) print $1}')
  if [ -n "$line" ]; then
    obsidian "obsidian://open?vault=kittybox&file=todo.md&line=$line" 2>/dev/null || kitty -e nvim "+$line" /home/kabir/Documents/Obsidian-vaults/kittybox/todo.md
  else
    echo "{query}" >> /home/kabir/Documents/Obsidian-vaults/kittybox/todo.md
    notify-send "Note saved" "Added: {query}"
  fi
"""

[shell.launcher.dmenu.entry.vault]
label = "Vault Browser"
prefix = "vault"
glyph = "folder"
global = false
freeform = true
command = """
  find /home/kabir/Documents/Obsidian-vaults/kittybox -name '*.md' -printf '%P\\n'
"""
exec = """
  sel="{selection}"
  vault="/home/kabir/Documents/Obsidian-vaults/kittybox"
  filepart=$(echo "$sel" | cut -d' ' -f1)
  content=$(echo "$sel" | cut -d' ' -f2-)
  if echo "$filepart" | grep -q '\\.md$' && [ -n "$content" ]; then
    echo "$content" > "$vault/$filepart"
    notify-send "Vault" "Written to $filepart"
  elif [ -f "$vault/$sel" ]; then
    obsidian "obsidian://open?vault=kittybox&file=$sel" 2>/dev/null || kitty -e nvim "$vault/$sel"
  fi
"""

[shell.launcher.dmenu.entry.shaders]
label = "Screen Shaders"
prefix = "shaders"
glyph = "sparkles"
global = false
freeform = false
command = """
  printf "Off\\n"; ls ~/.config/hypr/shaders/*.glsl | xargs -n1 basename | sed 's/\\.glsl$//'
"""
exec = """
  "$HOME/.config/hypr/scripts/shader-apply.sh" "$(echo "{selection}" | sed 's/^Off$/off/')"
"""

